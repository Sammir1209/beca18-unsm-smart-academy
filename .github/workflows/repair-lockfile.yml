name: Repair dependency lockfile

on:
  push:
    branches:
      - mobile-first-unsm-academy
    paths-ignore:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: mobile-first-unsm-academy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean reproducible install
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit corrected lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile for Cloudflare Pages"
          git push origin HEAD:mobile-first-unsm-academy
