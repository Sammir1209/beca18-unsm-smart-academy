name: Quality checks

on:
  push:
    branches: [main, mobile-first-unsm-academy, hardening/production-readiness-2026-11]
  pull_request:
    branches: [main, mobile-first-unsm-academy]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, test and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d3b4b7a1b4d9a5e6d9a5a2a9a7 # v4.0.3
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate question bank and project invariants
        run: npm test

      - name: Build production bundle
        run: npm run build
