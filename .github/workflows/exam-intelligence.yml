name: Exam Intelligence Quality

on:
  push:
    branches: [feat/exam-intelligence-pipeline]
    paths:
      - "tools/exam_intelligence/**"
      - "tests/exam_intelligence/**"
      - "pyproject.toml"
      - "data/questions/questions.json"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/exam-intelligence.yml"
  pull_request:
    branches: [mobile-first-unsm-academy]
    paths:
      - "tools/exam_intelligence/**"
      - "tests/exam_intelligence/**"
      - "pyproject.toml"
      - "data/questions/questions.json"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: exam-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pipeline core and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run pipeline tests
        run: pytest
      - name: Audit current question bank (read-only)
        run: exam-intel audit --bank data/questions/questions.json
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
