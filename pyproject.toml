[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "unsm-exam-intelligence"
version = "0.1.0"
description = "Evidence-based exam ingestion, OCR, classification and recurrence analysis for UNSM Academy"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.15,<1",
  "pydantic>=2.10,<3",
  "rapidfuzz>=3.12,<4",
  "pymupdf>=1.25,<2"
]

[project.optional-dependencies]
docling = ["docling>=2.30"]
ocr = ["ocrmypdf>=17.0"]
paddle = ["paddleocr>=3.0"]
semantic = ["sentence-transformers>=4.1"]
all = ["docling>=2.30", "ocrmypdf>=17.0", "paddleocr>=3.0", "sentence-transformers>=4.1"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
exam-intel = "exam_intelligence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["tools/exam_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests/exam_intelligence"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
